# 로컬 개발용 — Portainer 배포는 deploy/stack.yml 을 쓰세요.
services:
  viking:
    build:
      context: ..
      dockerfile: Dockerfile
    image: myviking:local
    container_name: myviking
    restart: unless-stopped
    ports:
      - "${VIKING_PORT:-8787}:8787"
    environment:
      VIKING_DATA: /data
      VIKING_ALLOW_SIGNUP: "true"
    volumes:
      - viking-data:/data

volumes:
  viking-data: