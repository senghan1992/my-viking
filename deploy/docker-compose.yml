# MyViking 을 컨테이너로 상시 실행합니다.
#
#   cd deploy && docker compose up -d
#   docker compose exec myviking jv key create laptop   # 외부 노출 시 필수
#   docker compose logs -f
#
# 데이터(메모리·프롬프트·세션·추적)는 myviking-data 볼륨에 남습니다.
# down/up 은 물론 컨테이너를 지워도 남습니다. 볼륨·호스트를 잃는 경우까지
# 대비하려면 Google Drive 백업을 연결하세요 (기동 후 언제든):
#
#   docker compose exec myviking jv backup connect --client-id ... --client-secret ...
#   docker compose exec myviking jv backup status
#
# 이후 서버가 주기적으로 스냅샷을 올리고 오래된 것은 회전시킵니다.
# 새 볼륨에 복원: docker compose exec myviking jv backup restore --yes

name: myviking

services:
  myviking:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: myviking:latest
    # 기본은 로컬 전용. 다른 머신의 에이전트가 붙어야 하면 "8787:8787" 로
    # 바꾸되 반드시 먼저 API 키를 발급하세요.
    ports:
      # up.sh 가 MYVIKING_PORTS 로 덮어씁니다.
      - "${MYVIKING_PORTS:-127.0.0.1:8787:8787}"
    volumes:
      - myviking-data:/data
    environment:
      JARVIS_HOME: /data
      # 요약·증류 품질을 올리려면 (없어도 완전히 동작합니다)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request as u; u.urlopen('http://127.0.0.1:8787/health').read()
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    # 이 서비스가 쓰는 것은 자기 데이터 볼륨뿐입니다.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  myviking-data:
