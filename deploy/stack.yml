# ═══════════════════════════════════════════════════════════════════════════
# myviking — Portainer 스택 (사람별 프로젝트 지식 도서관)
#
# 사용법 (Portainer):
#   1) Stacks → Add stack → 이름 입력 (예: myviking)
#   2) Build method:
#      a. "Repository" — 이 저장소 URL + 브랜치 main (스택 파일은 deploy/stack.yml)
#      b. 또는 "Web editor" 에 이 파일을 붙여넣기
#   3) Environment variables 에 아래 항목을 채우고 Deploy
#
# 최소 설정: VIKING_PORT (바깥에 열 포트, 기본 8787) 하나면 됩니다.
# 첫 가입자가 자동으로 관리자가 됩니다. 관리자 이메일을 고정하려면
# VIKING_ADMIN_EMAILS 에 쉼표 구분으로 넣으세요.
#
# HTTPS(도메인)가 필요하면 Portainer 에서 Traefik/NPM 같은 역방향 프록시를
# 이 서비스에 붙이세요. (역방향 프록시 뒤에서는 VIKING_BASE_URL 을 실제
# 공개 주소로 설정해야 연결 안내가 정확합니다)
# ═══════════════════════════════════════════════════════════════════════════

name: myviking

services:
  viking:
    build:
      context: ..
      dockerfile: Dockerfile
    image: myviking:local
    container_name: myviking
    restart: unless-stopped
    ports:
      # 바깥에 열 포트. Portainer 스택 배포 시 Environment variables 에서
      # VIKING_PORT 를 지정하거나 (기본 8787) 여기를 직접 고치세요.
      - "${VIKING_PORT:-8787}:8787"
    environment:
      VIKING_DATA: /data
      # ── 인증/가입 ──
      VIKING_SECRET: "${VIKING_SECRET:-}"            # (선택) 안 쓰면 자동 생성·볼륨에 보관
      VIKING_ALLOW_SIGNUP: "${VIKING_ALLOW_SIGNUP:-true}"
      VIKING_FIRST_USER_ADMIN: "${VIKING_FIRST_USER_ADMIN:-true}"
      VIKING_ADMIN_EMAILS: "${VIKING_ADMIN_EMAILS:-}"
      # ── 외부 주소 (연결 안내에 표시, 역방향 프록시 뒤에서 권장) ──
      VIKING_BASE_URL: "${VIKING_BASE_URL:-}"
      # ── 선택: LLM 요약 (OpenAI 호환 — DeepSeek·Groq·vLLM·Ollama·ARK 모두 가능) ──
      VIKING_LLM_BASE_URL: "${VIKING_LLM_BASE_URL:-}"
      VIKING_LLM_API_KEY: "${VIKING_LLM_API_KEY:-}"
      VIKING_LLM_MODEL: "${VIKING_LLM_MODEL:-}"
      # ── 선택: 임베딩 (의미 검색. 없으면 키워드 검색으로 동작) ──
      VIKING_EMBED_BASE_URL: "${VIKING_EMBED_BASE_URL:-}"
      VIKING_EMBED_API_KEY: "${VIKING_EMBED_API_KEY:-}"
      VIKING_EMBED_MODEL: "${VIKING_EMBED_MODEL:-}"
    volumes:
      - viking-data:/data

volumes:
  viking-data: