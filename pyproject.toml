[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "myviking"
version = "1.0.0"
description = "사람별 프로젝트 지식 도서관 — coding agent가 자동으로 채우고 참조하는 knowledge library"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "pydantic>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
jv = "jv.cli:main"

[tool.setuptools.packages.find]
include = ["app*", "jv*"]

[tool.pytest.ini_options]
testpaths = ["tests"]