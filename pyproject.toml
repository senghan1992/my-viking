[project]
name = "my-viking"
version = "0.1.0"
description = "MyViking — 프로젝트별 자가학습 컨텍스트 데이터베이스 (개인 Jarvis 백엔드)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6"]
mcp = ["mcp>=1.2"]
llm = ["httpx>=0.27"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
jv = "jarvis.cli:main"
jarvis-server = "jarvis.server:run"
jarvis-mcp = "jarvis.mcp_server:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
