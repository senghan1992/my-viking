[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scribe-kb"
version = "2.0.0"
description = "Scribe — a per-project knowledge library your pi scribe fills and recalls"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "pydantic>=2.0",
    "httpx>=0.27",
    "python-multipart>=0.0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
scribe = "scribe.cli:main"
jv = "scribe.cli:main"

[tool.setuptools.packages.find]
include = ["app*", "scribe*"]

[tool.pytest.ini_options]
testpaths = ["tests"]