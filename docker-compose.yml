# scribe — 단일 컨테이너 배포 파일 (이거 하나면 끝)
#   · docker compose:  cp .env.example .env → docker compose up -d --build
#   · Portainer:       Stacks → Add stack → 이 저장소(Repository, Path 비움)
#                      또는 Web editor 에 이 내용을 붙여넣기 → Deploy
name: scribe

services:
  scribe:
    build: .
    image: scribe:latest
    restart: unless-stopped
    ports:
      - "${SCRIBE_PORT:-8787}:8787"
    environment:
      SCRIBE_DATA: /data
      # ── 인증/가입 ──
      SCRIBE_SECRET: "${SCRIBE_SECRET:-}"                  # 비우면 자동 생성(볼륨에 보관)
      SCRIBE_ALLOW_SIGNUP: "${SCRIBE_ALLOW_SIGNUP:-true}"  # 운영 중엔 false 로 닫기
      SCRIBE_FIRST_USER_ADMIN: "${SCRIBE_FIRST_USER_ADMIN:-true}"
      SCRIBE_ADMIN_EMAILS: "${SCRIBE_ADMIN_EMAILS:-}"
      # ── 공개 주소 (역방향 프록시 뒤에서 권장) ──
      SCRIBE_BASE_URL: "${SCRIBE_BASE_URL:-}"
      # ── 선택: LLM/임베딩 (OpenAI 호환, 없어도 전체 동작) ──
      SCRIBE_LLM_BASE_URL: "${SCRIBE_LLM_BASE_URL:-https://api.openai.com/v1}"
      SCRIBE_LLM_API_KEY: "${SCRIBE_LLM_API_KEY:-}"
      SCRIBE_LLM_MODEL: "${SCRIBE_LLM_MODEL:-gpt-4o-mini}"
      SCRIBE_EMBED_BASE_URL: "${SCRIBE_EMBED_BASE_URL:-https://api.openai.com/v1}"
      SCRIBE_EMBED_API_KEY: "${SCRIBE_EMBED_API_KEY:-}"
      SCRIBE_EMBED_MODEL: "${SCRIBE_EMBED_MODEL:-text-embedding-3-small}"
    volumes:
      - scribe-data:/data   # index.db 전부 여기 (백업은 이 볼륨만)

volumes:
  scribe-data: