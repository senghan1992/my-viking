<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}myviking{% endblock %} · 도서관</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="brand" href="/">📚 <strong>myviking</strong><span class="brand-sub">프로젝트 지식 도서관</span></a>
    {% if user %}
    <nav class="nav">
      <a href="/">내 도서관</a>
      {% if user.role == 'admin' %}<a href="/admin">관리자</a>{% endif %}
      <span class="who">{{ user.name }}{% if user.role == 'admin' %} 👑{% endif %}</span>
      <form method="post" action="/logout" class="inline-form"><button class="btn ghost small" type="submit">로그아웃</button></form>
    </nav>
    {% endif %}
  </div>
</header>

<main class="wrap">
  {% if msg %}<div class="toast" id="toast">{{ msg }}</div>{% endif %}
  {% block content %}{% endblock %}
</main>

<footer class="wrap footer">
  <span>myviking — 코딩 에이전트가 자동으로 채우고 참조하는 프로젝트 지식 도서관</span>
</footer>
</body>
</html>
